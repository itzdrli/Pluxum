name: Release

# Opens or updates the "Version Packages" pull request while changelogs are pending in .tegami/,
# and publishes the @pluxum/* packages to npm once that pull request is merged.
# npm accepts these publishes through trusted publishing (OIDC), so no npm token is stored.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify release commit
        id: release-commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual releases must run from main."
            exit 1
          fi
          git fetch --no-tags origin main
          commit="$(git rev-parse HEAD)"
          if [ "$commit" != "$(git rev-parse origin/main)" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::main has advanced; start a new manual release from the current main commit."
              exit 1
            fi
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit will release once its CI passes."
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            passed="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main -f event=push -f head_sha="$commit" -f status=success -f per_page=1 \
              --jq '.total_count')"
            if [ "$passed" -eq 0 ]; then
              echo "::error::The current main commit has no passing CI run."
              exit 1
            fi
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@v5
        if: steps.release-commit.outputs.current == 'true'
        with:
          cache: true
          install: true

      - name: Install dependencies
        if: steps.release-commit.outputs.current == 'true'
        run: |
          vp install --frozen-lockfile
          vp exec pluxel workspace setup

      - name: Version or publish packages
        if: steps.release-commit.outputs.current == 'true'
        run: vp run tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: 'true'
