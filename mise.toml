[tools]
node = "24.22.0"
pnpm = "11.28.6"
hk = "2.7.0"
pitchfork = "2.32.0"
viteplus = "1.4.0"

[env]
_.path = ["node_modules/.bin"]
PNPM_CONFIG_PM_ON_FAIL = "ignore"
# Dev Redis from compose.dev.yaml (forum-valkey). Deployments provide their own value.
REDIS_CONNECTIONS = '[{"id":"session","url":"redis://127.0.0.1:6380"}]'
FORUM_TEST_REDIS_URL = "redis://127.0.0.1:6380"
# Until login exists (M2), every forum request in development acts as this account.
FORUM_DEV_IDENTITY = '{"displayName":"开发者","roles":["admin"]}'
