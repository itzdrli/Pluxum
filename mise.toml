[tools]
node = "24.22.0"
pnpm = "11.28.6"
hk = "2.7.0"
pitchfork = "2.32.0"
viteplus = "1.4.0"

[env]
_.path = ["node_modules/.bin"]
PNPM_CONFIG_PM_ON_FAIL = "ignore"
# Dev Redis from compose.dev.yaml (pluxum-valkey). Deployments provide their own value.
REDIS_CONNECTIONS = '[{"id":"session","url":"redis://127.0.0.1:6380"},{"id":"cache","url":"redis://127.0.0.1:6380","database":1},{"id":"rates","url":"redis://127.0.0.1:6380","database":2}]'
FORUM_TEST_REDIS_URL = "redis://127.0.0.1:6380"
# OpenUI (apps/web): never send install or runtime telemetry.
OPENUI_TELEMETRY_DISABLED = "1"
