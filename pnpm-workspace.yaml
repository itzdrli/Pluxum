packages:
  - host
  - host/web
  - apps/*
  - packages/*
  - plugins/*

allowBuilds:
  esbuild: true

catalogs:
  backend:
    '@sinclair/typebox': ^0.34.52
    exact-mirror: ^1.2.6
    elysia: 2.0.0-rc.0
    redis: ^6.3.0
    typebox: ^1.4.3
    tinybase: 10.0.1
  frontend:
    '@mantine/core': 9.7.3
    '@mantine/hooks': 9.7.3
    '@tabler/icons-react': ^3.49.0
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@vitejs/plugin-react': ^6.1.2
    # Published Workbench producers require this exact shared React version.
    react: 19.3.1
    react-dom: 19.3.1
  pluxel:
    '@pluxel/cli': ^1.1.0
    '@pluxel/core': ^1.1.0
    '@pluxel/commands': ^1.1.0
    '@pluxel/host': ^1.1.0
    '@pluxel/services': ^1.1.0
    '@pluxel/workbench': ^1.1.0
    '@pluxel/rolldown': ^1.1.0
    '@pluxel/host-vite': ^1.1.0
    '@pluxel/test': ^1.1.0
    '@pluxel/plugin-redis': 0.0.0
    '@pluxel/plugin-cache': 0.0.0
    '@pluxel/plugin-rates': 0.0.0
  validation:
    valibot: ^1.5.0
  test:
    vitest: 5.0.5
  tooling:
    vite-plus: 1.4.0
    '@types/node': ^26.6.5
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  prod:
    '@electric-sql/pglite': ^0.5.10
  nuxt:
    nuxt: ^4.6.3
    vue: ^3.5.44
    vue-router: ^5.4.0
    vue-tsc: ^3.3.14
overrides:
  # vue-tsc/Volar need the JS TypeScript API (<7); scoped so the workspace stays on TS 7.
  # vue-tsc/Volar need the JS TypeScript API (<7); only the Nuxt app gets TS 6, the workspace stays on TS 7.
  '@forum/web>typescript': 6.0.3
  'vite@*': npm:@voidzero-dev/vite-plus-core@1.4.0
  typebox: catalog:backend

# Verified registry signature and publisher match the previous Elysia 2 beta.
trustPolicyExclude:
  - elysia@2.0.0-rc.0

# Vite+ Core uses its own version while bundling the compatible Vite engine.
peerDependencyRules:
  allowedVersions:
    vite: 1.4.0
    # vite-plus-core's optional vue-tsc peer is unused outside apps/web (which runs TS 6).
    '@volar/typescript>typescript': '7'
    '@volar/language-service>typescript': '7'
