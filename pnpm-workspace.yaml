packages:
  - host
  - host/web
  - apps/*
  - packages/*
  - plugins/*

allowBuilds:
  esbuild: true

catalogs:
  backend:
    '@node-rs/jieba': ^2.0.4
    '@sinclair/typebox': ^0.34.52
    exact-mirror: ^1.2.6
    elysia: 2.0.0-rc.0
    drizzle-orm: ^0.45.4
    marked: 17.0.6
    nodemailer: 10.3.1
    pg: ^8.23.1
    redis: ^6.3.1
    s3mini: ^1.0.3
    sanitize-html: 2.18.1
    typebox: ^1.4.3
    tinybase: 10.0.1
  frontend:
    '@fontsource/ibm-plex-sans': 5.3.0
    '@fontsource/jetbrains-mono': 5.3.0
    '@fontsource/noto-sans-sc': 5.3.1
    '@heroui/react': 3.2.7
    '@heroui/styles': 3.2.7
    '@internationalized/date': ^3.12.4
    '@lingui/babel-plugin-lingui-macro': ^6.12.0
    '@lingui/cli': ^6.12.0
    '@lingui/conf': ^6.12.0
    '@lingui/core': ^6.12.0
    '@lingui/format-po': ^6.12.0
    '@lingui/react': ^6.12.0
    '@lingui/vite-plugin': ^6.12.0
    '@mantine/core': 9.7.4
    '@mantine/hooks': 9.7.4
    '@react-aria/ssr': ^3.10.1
    '@react-aria/utils': ^3.34.1
    '@react-router/dev': ^8.5.1
    '@react-router/node': ^8.5.1
    '@react-router/serve': ^8.5.1
    '@tabler/icons-react': ^3.50.0
    '@tailwindcss/vite': ^4.3.4
    '@tiptap/core': 3.32.2
    '@tiptap/extension-heading': 3.32.2
    '@tiptap/extension-image': 3.32.2
    '@tiptap/extension-table': 3.32.2
    '@tiptap/markdown': 3.32.2
    '@tiptap/pm': 3.32.2
    '@tiptap/react': 3.32.2
    '@tiptap/starter-kit': 3.32.2
    '@tiptap/suggestion': 3.32.2
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@vitejs/plugin-react': ^6.2.1
    isbot: ^5.2.2
    lenis: 1.3.27
    lucide-react: ^1.67.0
    # Published Workbench producers require this exact shared React version.
    react: 19.3.1
    react-aria: ^3.53.1
    react-aria-components: ^1.22.1
    react-dom: 19.3.1
    react-router: ^8.5.1
    tailwindcss: ^4.3.4
  # Published compatibility of plugin peers, apart from the versions installed.
  frontend-peer:
    '@mantine/core': 9.7.3
    '@mantine/hooks': 9.7.3
    '@tabler/icons-react': ^3.49.0
  pluxel:
    '@pluxel/cli': ^1.1.0
    '@pluxel/core': ^1.1.0
    '@pluxel/commands': ^1.1.0
    '@pluxel/host': ^1.1.0
    '@pluxel/services': ^1.1.0
    '@pluxel/workbench': ^1.1.0
    '@pluxel/rolldown': ^1.1.0
    '@pluxel/host-vite': ^1.1.0
    '@pluxel/test': ^1.1.0
    '@pluxel/plugin-redis': 0.0.0
    '@pluxel/plugin-storage': 0.0.0
    '@pluxel/plugin-cache': 0.0.0
    '@pluxel/plugin-fonts': ^1.1.0
    '@pluxel/plugin-takumi': ^1.1.0
    '@pluxel/plugin-rates': 0.0.0
  validation:
    valibot: ^1.5.0
    valibot-form: ^1.1.0
  test:
    happy-dom: 21.0.4
    vitest: 5.1.0
  tooling:
    '@babel/core': ^7.29.0
    '@rolldown/plugin-babel': ^0.3.1
    '@types/sanitize-html': 2.16.2
    vite-plus: 1.4.0
    '@types/node': ^26.6.6
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  prod:
    '@electric-sql/pglite': ^0.5.15
    jose: ^6.2.15
    capnweb: 0.12.0
overrides:
  'vite@*': npm:@voidzero-dev/vite-plus-core@1.4.0
  typebox: catalog:backend

# Verified registry signature and publisher match the previous Elysia 2 beta.
trustPolicyExclude:
  - elysia@2.0.0-rc.0

# Vite+ Core uses its own version while bundling the compatible Vite engine.
peerDependencyRules:
  allowedVersions:
    vite: 1.4.0
    # vite-plus-core lists vue-tsc as an optional peer; nothing here type-checks Vue, so its
    # Volar dependency's TypeScript <7 range does not apply to this TS 7 workspace.
    '@volar/typescript>typescript': '7'
    '@volar/language-service>typescript': '7'
