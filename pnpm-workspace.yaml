packages:
  - host
  - host/web
  - apps/*
  - packages/*
  - plugins/*

allowBuilds:
  esbuild: true

catalogs:
  backend:
    '@sinclair/typebox': ^0.34.52
    exact-mirror: ^1.2.6
    elysia: 2.0.0-rc.0
    drizzle-orm: ^0.45.4
    redis: ^6.3.0
    typebox: ^1.4.3
    tinybase: 10.0.1
  frontend:
    '@heroui/react': 3.2.6
    '@heroui/styles': 3.2.6
    '@internationalized/date': ^3.12.4
    '@mantine/core': 9.7.3
    '@mantine/hooks': 9.7.3
    '@react-aria/ssr': ^3.10.1
    '@react-aria/utils': ^3.34.1
    '@react-router/dev': ^8.5.1
    '@react-router/node': ^8.5.1
    '@react-router/serve': ^8.5.1
    '@tabler/icons-react': ^3.49.0
    '@tailwindcss/vite': ^4.3.3
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@vitejs/plugin-react': ^6.1.2
    isbot: ^5.2.2
    # Published Workbench producers require this exact shared React version.
    react: 19.3.1
    react-aria: ^3.53.1
    react-aria-components: ^1.22.1
    react-dom: 19.3.1
    react-router: ^8.5.1
    tailwindcss: ^4.3.3
  pluxel:
    '@pluxel/cli': ^1.1.0
    '@pluxel/core': ^1.1.0
    '@pluxel/commands': ^1.1.0
    '@pluxel/host': ^1.1.0
    '@pluxel/services': ^1.1.0
    '@pluxel/workbench': ^1.1.0
    '@pluxel/rolldown': ^1.1.0
    '@pluxel/host-vite': ^1.1.0
    '@pluxel/test': ^1.1.0
    '@pluxel/plugin-redis': 0.0.0
    '@pluxel/plugin-cache': 0.0.0
    '@pluxel/plugin-rates': 0.0.0
  validation:
    valibot: ^1.5.0
  test:
    vitest: 5.0.5
  tooling:
    vite-plus: 1.4.0
    '@types/node': ^26.6.5
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  prod:
    '@electric-sql/pglite': ^0.5.10
    jose: ^6.2.12
overrides:
  'vite@*': npm:@voidzero-dev/vite-plus-core@1.4.0
  typebox: catalog:backend

# Verified registry signature and publisher match the previous Elysia 2 beta.
trustPolicyExclude:
  - elysia@2.0.0-rc.0

# Vite+ Core uses its own version while bundling the compatible Vite engine.
peerDependencyRules:
  allowedVersions:
    vite: 1.4.0
    # vite-plus-core lists vue-tsc as an optional peer; nothing here type-checks Vue, so its
    # Volar dependency's TypeScript <7 range does not apply to this TS 7 workspace.
    '@volar/typescript>typescript': '7'
    '@volar/language-service>typescript': '7'
