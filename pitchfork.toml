# One shared HTTP ingress for every project; no certificate or system-network setup.
[settings.proxy]
enable = true
https = false
host = "127.0.0.1"
tld = "localhost"
lan = false
port = 8088
auto_trust = false
dns = false
sync_hosts = false

# Directory-derived namespaces keep projects and Git worktrees distinct.
[daemons.app]
run = "vp run @pluxum/host#dev:server"
mise = true
port = { expect = [5173], bump = 100 }
ready_output = { pattern = "(Local:|Application:|Workbench:)", timeout = "5m" }

# Forum frontend (React Router SSR + HeroUI). Proxies /api/forum/** to the app daemon above.
[daemons.web]
run = "pnpm --dir apps/web exec react-router dev"
mise = true
depends = ["app"]
port = { expect = [3000], bump = 100 }
ready_output = { pattern = "Local:", timeout = "5m" }

# Production build of the frontend for a public origin behind a reverse proxy (not the dev server:
# Vite's dev server must never be reachable from the internet). Rebuilds on every start.
# Bind address and port come from FORUM_WEB_BIND_HOST / FORUM_WEB_BIND_PORT (mise.local.toml);
# the default is loopback only. Start with `pitchfork start web-public`.
[daemons.web-public]
run = "sh -c 'pnpm --dir apps/web exec react-router build && NODE_ENV=production HOST=${FORUM_WEB_BIND_HOST:-127.0.0.1} PORT=${FORUM_WEB_BIND_PORT:-3100} exec pnpm --dir apps/web exec react-router-serve ./build/server/index.js'"
mise = true
depends = ["app"]
auto = []
ready_output = { pattern = "react-router-serve", timeout = "5m" }
